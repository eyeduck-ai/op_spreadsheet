<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Noto Sans TC", sans-serif;
        color: #202124;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; background: #f8f9fa; }
      main { padding: 18px; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 14px; color: #5f6368; line-height: 1.5; }
      .panel {
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .months {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        max-height: 280px;
        overflow: auto;
      }
      .month {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
      }
      .month input { margin: 0; }
      .month span { flex: 1; }
      .count { color: #5f6368; font-size: 12px; }
      .warning {
        border-left: 4px solid #f9ab00;
        background: #fef7e0;
        padding: 10px 12px;
        color: #5f4100;
        line-height: 1.5;
      }
      .confirm {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 10px;
        font-weight: 600;
      }
      .confirm input { margin-top: 3px; }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button {
        border: 0;
        border-radius: 4px;
        padding: 9px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      #submit, #copy { background: #1a73e8; color: #fff; }
      #finalize { background: #b3261e; color: #fff; }
      .actions { flex-wrap: wrap; }
      #cancel { background: #e8eaed; color: #3c4043; }
      button:disabled { opacity: .55; cursor: default; }
      #status { flex: 1; font-size: 13px; white-space: pre-wrap; }
      .error { color: #b3261e; }
      .success { color: #137333; }
    </style>
  </head>
  <body>
    <main>
      <h1>彙整舊月刀表</h1>
      <p>可選擇一個以上、早於目前月份的刀表；跨年度時會分別加入各年度封存表。</p>

      <section class="panel">
        <div id="months" class="months"></div>
      </section>

      <p class="warning">
        先預覽，建立私人 My Drive 整檔備份，再複製並回讀核對。
        第二次明確確認後才移除原月份分頁。可補封存較早月份，依月份排序；
        原年度分頁 ID、人工欄位及刪節線均保留。並存期間自動寫入暫停。
        完成後一般選單不提供還原，私人備份會保留。
        <label id="deletionArea" class="confirm" hidden>
          <input id="confirmDeletion" type="checkbox">
          <span>我已核對封存副本與私人備份，確認移除上述原月份分頁。</span>
        </label>
      </p>

      <div class="actions">
        <button id="submit" type="button">產生封存預覽</button>
        <button id="copy" type="button" hidden>建立私人備份並複製核對</button>
        <button id="check" type="button" hidden>核對更新結果</button>
        <button id="abort" type="button" hidden>取消未複製交易</button>
        <button id="finalize" type="button" hidden>確認封存後移除原月份</button>
        <button id="cancel" type="button">取消</button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
      <ul id="changes"></ul>
    </main>

    <script>
      const INITIAL_DATA = <?!= initialDataJson ?>;
      const monthsContainer = document.getElementById("months");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");
      const confirmDeletion = document.getElementById("confirmDeletion");
      const copy = document.getElementById("copy"), check = document.getElementById("check"), finalize = document.getElementById("finalize"), abort = document.getElementById('abort');
      let pending = INITIAL_DATA.pending, verified = false, busy = false;

      function render() {
        const active = pending && !['preview','applied','rejected'].includes(pending.status);
        submit.disabled = busy || active;
        copy.hidden = !pending?.canCopy; copy.disabled = busy;
        check.hidden = !active; check.disabled = busy;
        abort.hidden = !pending?.canCancel; abort.disabled = busy;
        finalize.hidden = pending?.status !== 'copied'; finalize.disabled = busy || !verified || !confirmDeletion.checked;
        document.getElementById('deletionArea').hidden = finalize.hidden;
        monthsContainer.querySelectorAll('input').forEach(input => { input.disabled = busy || active; });
        const list = document.getElementById('changes'); list.replaceChildren();
        for (const text of pending?.changes || []) { const item = document.createElement('li'); item.textContent = text; list.append(item); }
        if (pending?.message) status.textContent = pending.message;
      }

      function selectedMonths() {
        return Array.from(
          monthsContainer.querySelectorAll('input[type="checkbox"]:checked')
        ).map(input => input.value).sort();
      }

      INITIAL_DATA.months.forEach(month => {
        const label = document.createElement("label");
        label.className = "month";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = month.name;
        checkbox.checked = INITIAL_DATA.defaultMonths.includes(month.name);
        const name = document.createElement("span");
        name.textContent = month.name;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = month.patientCount === null ? '待核對' : `${month.patientCount} 筆`;
        checkbox.addEventListener('change', () => { if (pending?.status === 'preview') { pending = null; verified = false; render(); } });
        label.append(checkbox, name, count);
        monthsContainer.appendChild(label);
      });

      document.getElementById("cancel").addEventListener(
        "click",
        () => google.script.host.close()
      );
      function perform(action) {
        const months = selectedMonths();
        if (action === 'preview' && months.length < 1) {
          status.textContent = "請至少選擇一個已結束月份。";
          status.className = "error";
          return;
        }
        if (action === 'finalize' && (!verified || !confirmDeletion.checked)) {
          status.textContent = "請先確認永久刪除來源月份分頁。";
          status.className = "error";
          return;
        }

        busy = true; render();
        status.textContent = action === 'preview' ? '正在產生預覽…' : action === 'check' ? '只讀取並核對原批次，不重送…' : action === 'finalize' ? '正在核對封存並移除原月份…' : '正在建立私人備份並複製核對；原月份仍保留…';
        status.className = "";
        google.script.run
          .withSuccessHandler(result => {
            busy = false; pending = result; verified = result.status === 'copied' && ['copy','check'].includes(action);
            confirmDeletion.checked = false; render();
            status.className = result.ok ? "success" : "error";
          })
          .withFailureHandler(error => {
            busy = false; verified = false;
            if (pending && action !== 'preview') pending = { ...pending, status: 'uncertain', canCopy: false, message: '結果尚未確認，請核對原交易；不會自動重送。' };
            render();
            status.textContent = error && error.message
              ? error.message
              : String(error);
            status.className = "error";
          })
          .submitMonthlyRollupRequest({
            operationId: pending?.operationId || INITIAL_DATA.operationId,
            action,
            months,
            confirmedPermanentDeletion: action === 'finalize' && confirmDeletion.checked
          });
      }
      submit.addEventListener('click', () => perform('preview'));
      copy.addEventListener('click', () => perform('copy'));
      check.addEventListener('click', () => perform('check'));
      abort.addEventListener('click', () => perform('cancel'));
      finalize.addEventListener('click', () => perform('finalize'));
      confirmDeletion.addEventListener('change', render);
      render();
    </script>
  </body>
</html>
