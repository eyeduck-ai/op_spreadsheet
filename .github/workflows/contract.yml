name: Cross-repository sheet compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python tools/generate_contract.py --check
      - run: python -m pip install ./packages/python
      - run: node tests/formal_contract.js
      - run: python -m vghks_sheet_core.verify --gas-repo .
      - name: Read pinned main-program version
        id: consumer
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('contracts/consumers.json').read_text())
          revision = manifest['bot_revision']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: eyeduck-ai/vghks-bot
          ref: ${{ steps.consumer.outputs.revision }}
          path: .consumer-bot
          persist-credentials: false
      - run: python -m pip install ./.consumer-bot
      - run: python tools/verify_consumer.py --bot-repo .consumer-bot
