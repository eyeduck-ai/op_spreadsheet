name: Deploy Apps Script

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Apps Script
        run: |
          node --check code.js
          node --check sheet_model.js
          node --check calendar_sync.js
          node --check workflows.js
          node --check annual_archive.js
          node --check tests/smoke.js
          node tests/smoke.js

      - name: Setup clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push to Apps Script
        run: npx --yes @google/clasp@3.3.0 push --force
