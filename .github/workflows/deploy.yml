name: Deploy Apps Script

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      verification_spreadsheet_id:
        description: Spreadsheet ID to compare with the existing deployed project's parent
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Apps Script
        run: |
          node --check code.js
          node --check sheet_model.js
          node --check schedule_integrity.js
          node --check schedule_identity.js
          node --check workflows.js
          node --check annual_archive.js
          node --check tests/smoke.js
          node tests/smoke.js
          node --check tests/sheet_contract.js
          node tests/sheet_contract.js
          node --check tests/monitor_handover.js
          node tests/monitor_handover.js
          node --check tests/parser_contract.js
          node tests/parser_contract.js
          node --check tools/verify_bound_parent.js

      - name: Setup clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push to Apps Script
        run: npx --yes @google/clasp@3.3.0 push --force

      - name: Verify bound spreadsheet without exposing project identity
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          EXPECTED_SPREADSHEET_ID: 1hlQRr1-0rJKIy0Mf84-dI91zZD3jVURR-4eKOgndKc0
        run: node tools/verify_bound_parent.js

  verify_binding:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify existing bound spreadsheet without deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          EXPECTED_SPREADSHEET_ID: ${{ inputs.verification_spreadsheet_id }}
        run: node tools/verify_bound_parent.js
